    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta property="og:title" content="AI POWER — Building Planning, Design & Construction Intelligence" />
    <meta property="og:description" content="Transform your building vision into intelligent architectural designs, optimized construction plans, and accurate cost estimates." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI POWER — Building Planning, Design & Construction Intelligence" />
    <meta name="twitter:description" content="Next-generation AI architecture and construction management platform." />

    <style>
      #lovable-badge,
      [id*="lovable-badge"],
      aside[aria-label*="Lovable"],
      aside[aria-label*="Edit with Lovable"],
      a[href*="lovable.dev"],
      .lovable-badge {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        z-index: -99999 !important;
      }
    </style>
  </head>

  <body class="bg-[#070A11] text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>

    <script>
      (function() {
        function removeLovableElements() {
          const badges = document.querySelectorAll('#lovable-badge, [id*="lovable-badge"], aside[aria-label*="Lovable"], a[href*="lovable.dev"]');
          badges.forEach(function(el) {
            el.remove();
          });
        }
        removeLovableElements();
        document.addEventListener('DOMContentLoaded', removeLovableElements);
        window.addEventListener('load', removeLovableElements);
        const observer = new MutationObserver(function() {
          removeLovableElements();
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
